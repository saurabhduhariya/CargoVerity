name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma 7 loads prisma.config.ts during install/generate. No database connection is made in CI.
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/cargoverity
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm test
      - run: npm run build
